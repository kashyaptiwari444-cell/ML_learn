<!doctype html>
<html>
  <head>
    <title>PG Price Prediction</title>
  </head>
  <body>
    {% comment %}
    <h1>PG Price Prediction</h1>
    {% endcomment %}
    <p>Welcome to the PG Price Prediction app!</p>

    <form method="post">
      {% csrf_token %}

      <label>City</label>
      <select id="city">
        <option value="">Select City</option>
        <option value="Delhi">Delhi</option>
        <option value="Noida">Noida</option>
        <option value="Gurugram">Gurugram</option>
        <option value="Lucknow">Lucknow</option>
        <option value="Prayagraj">Prayagraj</option>

        {% comment %}
        <option value="Jaipur">Jaipur</option>
        <option value="Pune">Pune</option>
        <option value="Hyderabad">Hyderabad</option>
        <option value="Bengaluru">Bengaluru</option>
        <option value="Mumbai">Mumbai</option>
        {% endcomment %}
      </select>

      <br /><br />

      <label>Area</label>
      <select id="area">
        <option value="">Select Area</option>
      </select>
      <br /><br />

      <label>Room Type</label>
      <select id="roomType">
        <option value="">Select Room Type</option>
        <option value="1RK">1 RK</option>
        <option value="1BHK">1 BHK</option>
        <option value="2BHK">2 BHK</option>
        <option value="3BHK">3 BHK</option>
      </select>

      <br /><br />
      <label>Sharing </label>
      <select id="sharing">
        <option value="">Select Sharing</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>

      <br /><br />

      <label>Room Size SQFT</label>
      <input
        type="number"
        id="roomSize"
        placeholder="Enter Room Size in SQFT"
        required
      />

      <br /><br />

      <label>Food</label>
      <select id="food">
        <option value="">Select Food Option</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <br /><br />

      <label>WiFi</label>
      <select id="wifi">
        <option value="">Select WiFi Option</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <br /><br />

      <label>AC</label>
      <select id="ac">
        <option value="">Select AC Option</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <br /><br />

      <label>Attached Bathroom</label>
      <select id="attachedBathroom">
        <option value="">Select Attached Bathroom Option</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <br /><br />

      <label>Furnished</label>
      <select id="furnished">
        <option value="">Select Furnished Option</option>
        <option value="Fully Furnished">Fully Furnished</option>
        <option value="Semi Furnished">Semi Furnished</option>
        <option value="Unfurnished">Unfurnished</option>
      </select>

      <br /><br />

      <label>Parking</label>
      <select id="parking">
        <option value="">Select Parking Option</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <br /><br />

      <label>CCTV</label>
      <select id="cctv">
        <option value="">Select CCTV Option</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <br /><br />

      <label>Power Backup</label>
      <select id="powerBackup">
        <option value="">Select Power Backup Option</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </form>

    <script>
      const city = document.getElementById("city");
      const area = document.getElementById("area");

      const cities = {
        Delhi: [
          "Laxmi Nagar",
          "Mukherjee Nagar",
          "Hauz Khas",
          "Saket",
          "Karol Bagh",
          "Dwarka",
          "Rohini",
          "Rajouri Garden",
          "Vijay Nagar",
          "South Extension",
        ],

        Noida: [
          "Sector 15",
          "Sector 16",
          "Sector 18",
          "Sector 27",
          "Sector 51",
          "Sector 52",
          "Sector 62",
          "Sector 63",
          "Sector 76",
          "Sector 137",
        ],

        Gurugram: [
          "Sector 14",
          "Sector 15",
          "Sector 17",
          "Sector 21",
          "Sector 43",
          "Sector 44",
          "Sector 46",
          "Sector 49",
          "DLF Phase 2",
          "DLF Phase 3",
        ],

        Lucknow: [
          "Gomti Nagar",
          "Indira Nagar",
          "Aliganj",
          "Hazratganj",
          "Alambagh",
          "Jankipuram",
          "Mahanagar",
          "Vikas Nagar",
          "Chinhat",
          "Ashiyana",
        ],

        Prayagraj: [
          "Katra",
          "Civil Lines",
          "George Town",
          "Allahpur",
          "Salori",
          "Tagore Town",
          "Mumfordganj",
          "Teliarganj",
          "Old Katra",
          "Naini",
        ],
      };

      city.addEventListener("change", function () {
        area.innerHTML = '<option value="">Select Area</option>';

        const selectedCity = city.value;

        if (cities[selectedCity]) {
          cities[selectedCity].forEach(function (areaName) {
            const option = document.createElement("option");

            option.value = areaName;
            option.textContent = areaName;

            area.appendChild(option);
          });
        }
      });
    </script>
  </body>
</html>
